
name: Build AI Trade Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.aitradepro --project-name ai_trade_pro .

      - name: Set reliable Gradle distribution URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          lines = p.read_text().splitlines()
          lines = [("distributionUrl=https\\://downloads.gradle.org/distributions/gradle-8.3-bin.zip" if line.startswith("distributionUrl=") else line) for line in lines]
          p.write_text("\\n".join(lines) + "\\n")
          print(p.read_text())
          PY

      - name: Add Maven mirror fallback for Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text()
          mirror = "        maven { url 'https://maven.aliyun.com/repository/central' }\n        maven { url 'https://repo.huaweicloud.com/repository/maven/' }"
           s = s.replace("mavenCentral()", "mavenCentral()\n" + mirror)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
