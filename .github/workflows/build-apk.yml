
name: Build AI Trade Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - background-trading-service

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.aitradepro --project-name ai_trade_pro .

      - name: Configure foreground service Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle')
          s = p.read_text()
          s = s.replace("id \"org.jetbrains.kotlin.android\" version \"1.8.22\"", "id \"org.jetbrains.kotlin.android\" version \"1.9.24\"")
          s = s.replace("id \"com.android.application\" version \"8.1.0\"", "id \"com.android.application\" version \"8.3.2\"")
          p.write_text(s)
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text().replace('gradle-8.3-all.zip', 'gradle-8.6-all.zip').replace('gradle-8.3-bin.zip', 'gradle-8.6-bin.zip')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest '
          idx = s.find('>', s.find(marker)) + 1
          permissions = '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          s = s[:idx] + permissions + s[idx:]
          app_end = s.rfind('</application>')
          service = '\n        <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />\n    '
          s = s[:app_end] + service + s[app_end:]
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
