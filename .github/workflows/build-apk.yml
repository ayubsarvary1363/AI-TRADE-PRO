
name: Build RISE S TRADE APK (startup fix)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rise-s-trade-recovered

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.risestrade --project-name rise_s_trade .

      - name: Configure Android foreground service permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              name = permission.split('name="')[1].split('"')[0]
              if name not in s:
                  s = s.replace("<application", permission + "\\n    <application", 1)
          service = '''        <service
                  android:name="id.flutter.flutter_background_service.BackgroundService"
                  android:foregroundServiceType="dataSync"
                  android:exported="false" />'''
          if "id.flutter.flutter_background_service.BackgroundService" not in s:
              s = s.replace("</application>", service + "\\n    </application>", 1)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISE-S-TRADE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
