name: Build RISE S TRADE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rise-s-trade-recovered
      - feature/secure-multi-exchange-execution

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.aitradepro --project-name ai_trade_pro .

      - name: Ensure release network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          marker = "<manifest"
          start = content.find(marker)
          if start < 0:
              raise SystemExit("Android manifest root not found")
          end = content.find(">", start)
          if end < 0:
              raise SystemExit("Android manifest root is malformed")
          permissions = [
              "    <uses-permission android:name=\"android.permission.INTERNET\" />",
              "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />",
          ]
          for permission in permissions:
              name = permission.split('name="')[1].split('"')[0]
              if name not in content:
                  content = content[:end + 1] + "\n" + permission + content[end + 1:]
                  end += len(permission) + 1
          manifest.write_text(content, encoding="utf-8")
          if "android.permission.INTERNET" not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("INTERNET permission was not added")
          PY

      - name: Set Android app label
        run: sed -i 's/android:label="[^"]*"/android:label="RISE S TRADE"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --concurrency=1

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISE-S-TRADE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
