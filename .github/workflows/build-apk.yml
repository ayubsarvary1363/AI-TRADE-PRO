
name: Build RISE S TRADE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rise-s-trade-recovered

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Recreate Android project structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.aitradepro --project-name ai_trade_pro .

      - name: Set Android app label
        run: sed -i 's/android:label="[^"]*"/android:label="RISE S TRADE"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISE-S-TRADE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
